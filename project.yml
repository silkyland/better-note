name: BetterNote
options:
  bundleIdPrefix: com.devded
  deploymentTarget:
    macOS: '14.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    MACOSX_DEPLOYMENT_TARGET: '14.0'
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: '-'
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
targets:
  BetterNote:
    type: application
    platform: macOS
    sources:
      - path: Sources/BetterNote
        excludes:
          - Resources/Assets.xcassets
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.devded.betternote
        PRODUCT_NAME: BetterNote
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Sources/BetterNote/Info.plist
        MARKETING_VERSION: '1.0.0-beta.1'
        CURRENT_PROJECT_VERSION: '4'
  BetterNoteTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests/BetterNoteTests]
    dependencies:
      - target: BetterNote
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  BetterNote:
    build:
      targets:
        BetterNote: all
    test:
      targets: [BetterNoteTests]
